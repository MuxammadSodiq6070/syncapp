# ==============================================================================
# Coturn TURN/STUN Server Configuration for Sync WebRTC
# Production-ready configuration tailored for Mobile Networks (4G/LTE/5G & CGNAT)
# ==============================================================================
#
# PURPOSE:
# Sync utilizes WebRTC for secure 1-to-1 audio and video calling. While direct P2P
# media connections succeed across open networks, mobile cellular carriers utilize
# Carrier-Grade NAT (CGNAT), symmetric NAT, and dynamic IP reassignment that block
# direct P2P connections.
#
# This Coturn configuration provides:
# 1. High-performance STUN (Session Traversal Utilities for NAT - RFC 5389).
# 2. Resilient TURN (Traversal Using Relays around NAT - RFC 5766 / RFC 6156).
# 3. TURNS over TLS/DTLS (RFC 7350) for deep-packet-inspection (DPI) & firewall bypass.
# 4. ICE Mobility (RFC 8016 MICE) for seamless Wi-Fi <-> 4G/LTE cellular roaming.
# 5. Strict security controls to prevent SSRF and relay amplification abuse.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. NETWORK LISTENING & PORTS
# ------------------------------------------------------------------------------

# Primary STUN/TURN listening port for plain UDP and TCP.
# Standard WebRTC port is 3478.
listening-port=3478

# Primary TURNS listening port for encrypted TLS over TCP and DTLS over UDP.
# Standard port is 5349.
tls-listening-port=5349

# Alternative listening ports for restrictive firewalls.
# Many mobile cellular operators or corporate Wi-Fi block UDP/TCP port 3478.
# Port 443 allows TURN-over-TLS to masquerade as standard HTTPS traffic.
# (If port 443 is available on this IP, enable the line below):
# alt-tls-listening-port=443

# Relay Port Range (UDP allocation range for media relay).
# WebRTC streams between peers use ports within this range.
# NOTE: Ensure your host firewall (UFW/iptables/cloud security group) allows UDP ingress
# across this range: `ufw allow 49152:65535/udp`.
min-port=49152
max-port=65535

# External Public IP & NAT Mapping.
# If Coturn is deployed on a cloud VM behind 1:1 NAT (AWS EC2, GCP, Azure, Hetzner, etc.),
# you MUST specify the public IPv4 address and local private IPv4 address:
# Format: external-ip=<PUBLIC_IP>/<PRIVATE_IP> or simply external-ip=<PUBLIC_IP>
# Examples:
# external-ip=203.0.113.50/10.0.1.5
# external-ip=203.0.113.50
# If you have an IPv6 address, specify it with a second external-ip directive:
# external-ip=2001:db8::1

# ------------------------------------------------------------------------------
# 2. REALM & AUTHENTICATION
# ------------------------------------------------------------------------------

# The server realm is used in the digest authentication calculation.
# Must match the domain configured on the application clients.
realm=turn.sync.app

# Enable Long-Term Credential mechanism (mandatory for WebRTC RFC 5389 / 5766).
lt-cred-mech

# Use TURN REST API ephemeral time-limited credentials (recommended for production).
# WebRTC clients request temporary credentials from the Sync backend.
# The backend generates:
#   username: <timestamp>:<user_id>
#   password: Base64(HMAC-SHA1(username, static-auth-secret))
use-auth-secret

# Shared secret key between Coturn and the Sync backend server.
# GENERATE A STRONG RANDOM SECRET (e.g. `openssl rand -hex 32`) AND REPLACE THIS:
static-auth-secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

# Static user credentials (for testing and fallback verification only).
# In production, use-auth-secret is preferred over static users.
# user=syncuser:SyncSecretPassword2026!

# ------------------------------------------------------------------------------
# 3. MOBILE NETWORK (4G/LTE/5G) & NAT TRAVERSAL OPTIMIZATIONS
# ------------------------------------------------------------------------------

# Enable ICE Mobility (RFC 8016 MICE).
# CRITICAL FOR MOBILE: When a smartphone switches between Wi-Fi and 4G/LTE mobile
# data mid-call (or roams between cell towers), the client's reflexive IP changes.
# Mobility allows the client to update its TURN allocation without terminating the call.
mobility

# Mandatory for WebRTC: Add fingerprint attribute to all STUN/TURN packets.
# Required by WebRTC RFC 5766 to distinguish TURN packets from media multiplexing.
fingerprint

# Automatically refresh stale nonces without failing authentication abruptly.
stale-nonce

# Allocation and Permission Lifetimes (seconds).
# Mobile carrier CGNAT state tables often expire UDP NAT mappings after 30-60s of inactivity.
# Standard WebRTC peers send STUN keepalives every 2-10 seconds.
channel-lifetime=600
permission-lifetime=300

# Keep same address family (IPv4/IPv6) for client and peer allocations.
keep-address-family

# ------------------------------------------------------------------------------
# 4. SECURITY HARDENING & ANTI-ABUSE
# ------------------------------------------------------------------------------

# Block multicast traffic to prevent UDP amplification and reflection attacks.
no-multicast

# Disallow loopback peers (127.0.0.1, ::1) to prevent SSRF against localhost services.
no-loopback-peers

# Denied Peer IP Ranges:
# Prevent using this TURN server as an internal network proxy or port scanner
# against private VPC/LAN subnets (RFC 1918, Link-Local, and Cloud Metadata services).
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Disable Telnet CLI administration to eliminate an unnecessary attack surface.
no-cli

# Session bandwidth limits to protect against DoS and bandwidth exhaustion:
# Maximum bits-per-second per session (3 Mbps provides optimal 720p/1080p WebRTC stream):
max-bps=3000000

# Total allocation quota across all sessions (adjust according to server capacity):
total-quota=1200

# Maximum allocations per user identity:
user-quota=10

# ------------------------------------------------------------------------------
# 5. TLS / DTLS ENCRYPTION HARDENING
# ------------------------------------------------------------------------------

# TLS Certificates (Required for TURNS over port 5349 / 443).
# Use valid certificates from Let's Encrypt or your CA:
cert=/etc/coturn/certs/turn_server_cert.pem
pkey=/etc/coturn/certs/turn_server_pkey.pem

# Modern, secure cipher suites:
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384"

# Disable legacy, insecure SSL/TLS versions:
no-tlsv1
no-tlsv1_1

# ------------------------------------------------------------------------------
# 6. LOGGING & SYSTEM DAEMON
# ------------------------------------------------------------------------------

# Log file destination:
log-file=/var/log/coturn/turnserver.log

# Use clean, single-line log format:
simple-log

# Run as non-privileged service user:
proc-user=turnserver
proc-group=turnserver

